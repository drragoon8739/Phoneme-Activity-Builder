<style>

    :root {
      --font-display: ui-monospace, "Cascadia Mono", "Segoe UI Mono", "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
      --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

      --paper: #eaeff1;
      --card: #ffffff;
      --sunk: #f3f6f8;
      --ink: #14212a;
      --muted: #566873;
      --line: #c8d5db;
      --line-strong: #a9bbc4;
      --brand: #7a2e56;
      --brand-ink: #ffffff;
      --brand-soft: #f4e5ed;
      --correct: #2e7d53;
      --correct-soft: #d9eee2;
      --present: #9c6b06;
      --present-soft: #faecca;
      --absent: #6d818c;
      --absent-soft: #e2e9ec;
      --radius: 10px;
      color-scheme: light;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px 48px;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-body);
      line-height: 1.6;
      min-height: 100vh;
    }

    .wrap { width: min(960px, 100%); margin: 0 auto; }

    header.page-head { margin-bottom: 24px; }

    .eyebrow {
      font-family: var(--font-display);
      font-size: 0.8125rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 4px;
    }

    h1 {
      font-family: var(--font-display);
      font-size: clamp(1.6rem, 4vw, 2.25rem);
      letter-spacing: -0.02em;
      margin: 0 0 8px;
    }

    .sub { color: var(--muted); margin: 0; }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .btn {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 1rem;
      min-height: 44px;
      padding: 10px 20px;
      border-radius: var(--radius);
      border: 1px solid transparent;
      background: var(--brand);
      color: var(--brand-ink);
      cursor: pointer;
    }

    .btn:hover { filter: brightness(1.08); }

    .btn.secondary {
      background: transparent;
      color: var(--ink);
      border-color: var(--line-strong);
    }

    .btn-row { display: flex; flex-wrap: wrap; gap: 12px; }

    :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }

    /* The phoneme tile, carried over from the builder so the activity and the

    .tile {
      position: relative;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      min-width: 3.25rem;
      min-height: 3.25rem;
      padding: 4px 6px;
      background: var(--sunk);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      color: var(--ink);
      line-height: 1;
      font: inherit;
    }

    .tile .glyph { font-family: var(--font-ipa); font-size: 1.3rem; font-weight: 600; }
    .tile .gloss {
      font-family: var(--font-display);
      font-size: 0.625rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    button.tile { cursor: pointer; }
    button.tile:hover { border-color: var(--brand); background: var(--brand-soft); }
    button.tile:disabled { opacity: 0.45; cursor: not-allowed; }

    .tile.correct { background: var(--correct-soft); border-color: var(--correct); box-shadow: inset 0 0 0 2px var(--correct); }
    .tile.present { background: var(--present-soft); border-color: var(--present); box-shadow: inset 0 0 0 2px var(--present); }
    .tile.absent  { background: var(--absent-soft); border-color: var(--absent); color: var(--muted); }

    .hint {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      white-space: nowrap;
      padding: 5px 9px;
      border-radius: 6px;
      background: var(--ink);
      color: var(--paper);
      font-size: 0.8125rem;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 150ms ease;
    }

    .hint b { font-family: var(--font-ipa); color: var(--brand); margin-right: 6px; }

    .hint::after {
      content: '';
      position: absolute; top: 100%; left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-top-color: var(--ink);
    }

    .tile:hover > .hint, .tile:focus-visible > .hint { opacity: 1; visibility: visible; }

    .status {
      border-left: 4px solid var(--brand);
      background: var(--brand-soft);
      padding: 12px 16px;
      border-radius: 0 var(--radius) var(--radius) 0;
      margin-bottom: 16px;
    }

    .status.win { border-left-color: var(--correct); background: var(--correct-soft); }
    .status.lose { border-left-color: var(--present); background: var(--present-soft); }

    footer.page-foot {
      margin-top: 32px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.8125rem;
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.001ms !important; animation-duration: 0.001ms !important; }
    }
  

  .ws-layout { display: grid; gap: 20px; grid-template-columns: 1fr; }
  @media (min-width: 820px) { .ws-layout { grid-template-columns: 1fr 20rem; align-items: start; } }

  .ws-grid {
    display: grid;
    gap: 3px;
    justify-content: center;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  .ws-cell {
    display: flex; align-items: center; justify-content: center;
    aspect-ratio: 1;
    min-width: 2.1rem;
    font-family: var(--font-ipa);
    font-size: clamp(0.85rem, 2.2vw, 1.1rem);
    font-weight: 600;
    background: var(--sunk);
    border: 1px solid var(--line);
    border-radius: 6px;
    cursor: pointer;
  }

  .ws-cell.selected { background: var(--present-soft); border-color: var(--present); }
  .ws-cell.found { background: var(--correct-soft); border-color: var(--correct); color: var(--correct); }
  .ws-cell.solution { outline: 2px dashed var(--brand); outline-offset: -2px; }

  .word-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }

  .word-item {
    display: flex; flex-direction: column; gap: 2px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--sunk);
  }

  .word-item.found { border-color: var(--correct); background: var(--correct-soft); }
  .word-item .english { font-weight: 700; }
  .word-item.found .english { color: var(--correct); }
  .word-item .strip { font-family: var(--font-ipa); color: var(--muted); letter-spacing: 0.04em; }
  .word-item .strip[hidden] { display: none; }

  .progress { font-family: var(--font-display); font-size: 0.8125rem; color: var(--muted); margin-bottom: 12px; }

</style>
</head>
<body>
<div class="wrap">

<header class="page-head">
  <p class="eyebrow">Phoneme activity</p>
  <h1>Phoneme Word Search</h1>
  <p class="sub">Drag across the grid to trace each word in phonemes.</p>
</header>

<div class="card">
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <div class="ws-layout">
    <div id="grid" class="ws-grid" role="grid" aria-label="Word search grid"></div>
    <div>
      <p id="progress" class="progress"></p>
      <ul id="words" class="word-list"></ul>
      <div class="btn-row" style="margin-top:16px">
        <button type="button" id="answers" class="btn secondary">Show answers</button>
        <button type="button" id="restart" class="btn secondary">Start again</button>
      </div>
    </div>
  </div>
</div>

<footer class="page-foot">
  <p>Generated with the Phoneme Activity Builder — David Huynh · 22428106</p>
  <p>Runs offline in any modern browser. No internet connection required.</p>
</footer>

<script>

"},{"ipa":"w","label":"W","example":"win"},{"ipa":"j","label":"Y","example":"yes"},{"ipa":"tʃ","label":"CH","example":"chin"},{"ipa":"dʒ","label":"J","example":"jam"},{"ipa":"iː","label":"EE","example":"street"},{"ipa":"ɪ","label":"I","example":"bid"},{"ipa":"e","label":"E","example":"bed"},{"ipa":"eː","label":"AIR","example":"square"},{"ipa":"æ","label":"A","example":"bad"},{"ipa":"ɐ","label":"U","example":"bud"},{"ipa":"ɐː","label":"AR","example":"bark"},{"ipa":"ɜː","label":"ER","example":"bird"},{"ipa":"ʉː","label":"OO","example":"boot"},{"ipa":"ɔ","label":"O","example":"log"},{"ipa":"oː","label":"OR","example":"fork"},{"ipa":"ʊ","label":"U","example":"book"},{"ipa":"æɪ","label":"AY","example":"bait"},{"ipa":"ɑe","label":"IE","example":"bike"},{"ipa":"oɪ","label":"OY","example":"boil"},{"ipa":"əʉ","label":"OH","example":"boat"},{"ipa":"æɔ","label":"OW","example":"cloud"},{"ipa":"ɪə","label":"EAR","example":"beard"},{"ipa":"ə","label":"UH","example":"wɜːdəl"}]};

(function () {
  var CONFIG = window.__ACTIVITY__;
  var REF = {};
  CONFIG.phonemes.forEach(function (p) { REF[p.ipa] = p; });

  var gridEl = document.getElementById('grid');
  var listEl = document.getElementById('words');
  var statusEl = document.getElementById('status');
  var progressEl = document.getElementById('progress');

  var found = {};
  var selecting = false;
  var startCell = null;
  var showingAnswers = false;

  function describe(ipa) {
    var p = REF[ipa];
    if (!p) return ipa;
    return '/' + ipa + '/ — ' + p.label + ' (as in ' + p.example + ')';
  }

  function renderGrid() {
    gridEl.style.gridTemplateColumns = 'repeat(' + CONFIG.cols + ', minmax(2.1rem, 1fr))';
    var html = '';
    for (var r = 0; r < CONFIG.rows; r++) {
      for (var c = 0; c < CONFIG.cols; c++) {
        var ipa = CONFIG.grid[r][c];
        html += '<div class="ws-cell" data-r="' + r + '" data-c="' + c + '" title="' +
          describe(ipa) + '">' + ipa + '</div>';
      }

    gridEl.innerHTML = html;

  function renderList() {
    var html = '';

      var isFound = !!found[word.key];
      var showEnglish = CONFIG.listMode !== 'phonemes' || isFound;
      var showStrip = CONFIG.listMode !== 'english' || isFound;
      html += '<li class="word-item ' + (isFound ? 'found' : '') + '">' +

        (showStrip ? '<span class="strip">' + word.phonemes.map(function (p) { return '/' + p + '/'; }).join(' ') + '</span>' : '') +
        '</li>';

    listEl.innerHTML = html;

    var total = CONFIG.words.length;
    var count = Object.keys(found).length;
    progressEl.textContent = count + ' of ' + total + ' found';
    if (count === total) {
      statusEl.className = 'status win';
      statusEl.textContent = 'All words found. Well done.';
    }
  }

  function cellAt(r, c) {
    return gridEl.querySelector('[data-r="' + r + '"][data-c="' + c + '"]');
  }

  function clearSelection() {
    var cells = gridEl.querySelectorAll('.ws-cell.selected');
    for (var i = 0; i < cells.length; i++) cells[i].classList.remove('selected');
  }

  function pathBetween(a, b) {
    var r1 = +a.getAttribute('data-r'), c1 = +a.getAttribute('data-c');
    var r2 = +b.getAttribute('data-r'), c2 = +b.getAttribute('data-c');
    var dr = r2 - r1, dc = c2 - c1;
    if (dr !== 0 && dc !== 0 && Math.abs(dr) !== Math.abs(dc)) return null;
    var steps = Math.max(Math.abs(dr), Math.abs(dc));
    var stepR = steps === 0 ? 0 : dr / steps;
    var stepC = steps === 0 ? 0 : dc / steps;

    if (a.length !== b.length) return false;
    for (var i = 0; i < a.length; i++) {

    var reversed = path.slice().reverse();

  document.getElementById('answers').addEventListener('click', function () {
    showingAnswers = !showingAnswers;
    this.textContent = showingAnswers ? 'Hide answers' : 'Show answers';

      word.coords.forEach(function (co) {
        var cell = cellAt(co.r, co.c);
        if (cell) cell.classList.toggle('solution', showingAnswers);

    });

  document.getElementById('restart').addEventListener('click', function () {
    found = {};
    showingAnswers = false;
    document.getElementById('answers').textContent = 'Show answers';

  });

  renderGrid();
  renderList();
