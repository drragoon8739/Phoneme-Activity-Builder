# Convenience wrapper around the Dockerfile.
#
# `docker compose up --build` is one command instead of a build plus a run with
# a hand-typed volume flag, which makes the demo reproducible and is far easier
# to get right on camera than remembering the flags.

services:
  app:
    build: .
    container_name: phoneme-activity-builder
    ports:
      - "3000:3000"
    environment:
      # The SQLite file lives on the named volume below, not in the image, so
      # data survives `docker compose down` and image rebuilds.
      DATABASE_URL: "file:/app/data/production.db"
      NODE_ENV: production
    volumes:
      - phoneme-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  phoneme-data:
